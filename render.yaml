# Render.com (ucretsiz plan) icin: bu depoyu GitHub'a yukle, Render'da "New > Blueprint" ile baglan.
services:
  - type: web
    name: motometa-server
    runtime: node
    plan: free
    rootDir: Server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL        # Neon connection string (Render panelinden gir; repoya YAZMA)
        sync: false
      - key: RETENTION_DAYS      # kayit saklama suresi (gun)
        value: "365"
